app = "pet-gaia-agent"
primary_region = "gru" # São Paulo — menor latência para Brasil

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "America/Sao_Paulo"
  # NOTA: tentamos usar HOME=/data aqui para apontar o Claude Code para o
  # volume persistente, mas o Fly.io ignora/reseta essa variável específica
  # (confirmado testando em produção). A solução real está em
  # scripts/run-agent.sh, que copia as credenciais entre /data e o $HOME
  # real a cada execução — não depende dessa variável.

# Fase 1 (piloto): execução agendada 2x/dia via Fly Machines scheduled run.
# 08:00 e 18:00 horário de Brasília — configurado via `fly machine run` com
# a flag --schedule, ou via GitHub Actions cron chamando a Fly Machines API.

[[mounts]]
  source = "pet_gaia_agent_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
