services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: festae
      POSTGRES_PASSWORD: festae_dev_password
      POSTGRES_DB: festae_dev
    ports:
      - "5432:5432"
    volumes:
      - festae_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festae"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://festae:festae_dev_password@postgres:5432/festae_dev
      JWT_SECRET: dev-secret-change-me
      PORT: 3333
    ports:
      - "3333:3333"

volumes:
  festae_postgres_data:
