services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: festae
      POSTGRES_PASSWORD: festae_dev_password
      POSTGRES_DB: festae_dev
    ports:
      - "5432:5432"
    volumes:
      - festae_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festae"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://festae:festae_dev_password@postgres:5432/festae_dev
      PORT: 3333
      # Este compose é só para desenvolvimento local. Em produção nada aqui
      # vale: as variáveis vêm do painel do provedor, e o segredo precisa ser
      # aleatório de verdade.
      JWT_SECRET: apenas-para-desenvolvimento-local
      SEED_ADMIN_EMAIL: admin@localhost
      SEED_ADMIN_PASSWORD: admin-local-123
      SEED_DEMO_DATA: "true"
    ports:
      - "3333:3333"

volumes:
  festae_postgres_data:
