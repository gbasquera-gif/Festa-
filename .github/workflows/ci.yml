name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: festae
          POSTGRES_PASSWORD: festae_ci_password
          POSTGRES_DB: festae_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festae"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://festae:festae_ci_password@localhost:5432/festae_ci
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & typecheck all packages
        run: pnpm exec turbo run build check

      - name: Apply Prisma migrations (catches broken/drifted migrations)
        run: pnpm --filter @festae/database run migrate:deploy

      - name: Validate mobile web bundle
        run: pnpm --filter @festae/mobile exec expo export --platform web
