name: EAS Build (mobile)

# Manual trigger only — EAS builds consume Expo's build credits, so we
# don't want every push kicking one off. Requires an EXPO_TOKEN repo
# secret (from https://expo.dev/accounts/[account]/settings/access-tokens)
# and the project to be linked via `eas init` (sets extra.eas.projectId
# in apps/mobile/app.json) — neither of which can be done from CI itself.
#
# The `push` trigger below only exists so GitHub registers this workflow
# as dispatchable (workflow_dispatch requires a prior run to be known to
# the Actions API, and this repo's default branch doesn't carry this
# file). It's scoped to changes on this exact file, and the job itself
# no-ops on that event — it never actually builds anything on push.
on:
  push:
    paths: [".github/workflows/eas-build.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options: ["android", "ios", "all"]
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options: ["development", "preview", "production"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Primeira execução: o projeto ainda não existe no Expo. `eas init`
      # cria o projeto e grava extra.eas.projectId no app.json — sem isso,
      # `eas build` recusa rodar em modo não-interativo. Faz isso só uma
      # vez (rodas seguintes já encontram o projectId e pulam).
      - name: Link EAS project (only if not linked yet)
        id: eas_init
        working-directory: apps/mobile
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force 2>&1 | tee /tmp/eas-init.log
            exit ${PIPESTATUS[0]}
          fi

      # Não consigo abrir os logs brutos do Actions do ambiente onde
      # trabalho (rede restrita) — se o passo acima falhar, publica a
      # saída como comentário no PR pra eu conseguir ler e diagnosticar.
      - name: Report eas init failure
        if: steps.eas_init.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**eas init falhou** (run ${{ github.run_id }}):"
            echo '```'
            cat /tmp/eas-init.log 2>/dev/null || echo "(sem log capturado)"
            echo '```'
          } > /tmp/comment-body.md
          gh pr comment 2 --repo ${{ github.repository }} --body-file /tmp/comment-body.md || \
            gh api repos/${{ github.repository }}/issues/2/comments -f body="$(cat /tmp/comment-body.md)"
          exit 1

      - name: Persist EAS project link
        run: |
          if ! git diff --quiet -- apps/mobile/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/mobile/app.json
            git commit -m "chore: linka projeto EAS (automático)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build
        id: eas_build
        working-directory: apps/mobile
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait 2>&1 | tee /tmp/eas-build.log
          exit ${PIPESTATUS[0]}

      - name: Report eas build failure
        if: steps.eas_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**eas build falhou** (run ${{ github.run_id }}):"
            echo '```'
            cat /tmp/eas-build.log 2>/dev/null || echo "(sem log capturado)"
            echo '```'
          } > /tmp/comment-body.md
          gh pr comment 2 --repo ${{ github.repository }} --body-file /tmp/comment-body.md || \
            gh api repos/${{ github.repository }}/issues/2/comments -f body="$(cat /tmp/comment-body.md)"
          exit 1
