# Dispara o ciclo agendado do agente Pet Gaia (leitura + recomendações via
# Telegram) 2x/dia, 08:00 e 18:00 horário de Brasília. Existe porque o
# agendamento nativo do Fly Machines (--schedule) só suporta intervalos
# genéricos (hourly/daily/weekly), não horários exatos — ver
# pet-gaia-agent/fly.toml.
#
# Brasília não tem mais horário de verão desde 2019, então o offset é fixo:
# UTC-3. 08:00 BRT = 11:00 UTC, 18:00 BRT = 21:00 UTC.
#
# Faz `flyctl deploy` antes de iniciar a máquina: sem isso, mudanças no
# repositório nunca chegavam na imagem em produção (a máquina só era
# reiniciada com o que já estava implantada, exigindo `fly deploy` manual
# no terminal para qualquer atualização pegar).
name: pet-gaia-agent — ciclo agendado

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar flyctl
        run: curl -L https://fly.io/install.sh | sh

      - name: Deploy da imagem atualizada
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: pet-gaia-agent
        run: |
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          flyctl deploy -a pet-gaia-agent --remote-only

      # Combinado numa step só: `flyctl logs` streama ao vivo (não busca
      # histórico depois do fato), então o tail em segundo plano precisa
      # começar logo após o `machine start`, antes de esperar a máquina
      # voltar a "stopped".
      - name: Iniciar o ciclo do agente e coletar logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export FLYCTL_INSTALL="/home/runner/.fly"
          export PATH="$FLYCTL_INSTALL/bin:$PATH"
          MACHINE_ID=$(flyctl machine list -a pet-gaia-agent --json | jq -r '.[0].id')
          if [ -z "$MACHINE_ID" ] || [ "$MACHINE_ID" = "null" ]; then
            echo "Não encontrei nenhuma máquina em pet-gaia-agent." >&2
            exit 1
          fi
          echo "Iniciando máquina $MACHINE_ID"
          flyctl machine start "$MACHINE_ID" -a pet-gaia-agent

          flyctl logs -a pet-gaia-agent -i "$MACHINE_ID" > /tmp/agent-cycle.log 2>&1 &
          LOGS_PID=$!

          echo "Aguardando máquina $MACHINE_ID voltar a 'stopped' (até 10 min)..."
          for i in $(seq 1 60); do
            STATE=$(flyctl machine list -a pet-gaia-agent --json | jq -r --arg id "$MACHINE_ID" '.[] | select(.id==$id) | .state')
            echo "[$i/60] estado atual: $STATE"
            if [ "$STATE" = "stopped" ]; then
              break
            fi
            sleep 10
          done

          sleep 5
          kill "$LOGS_PID" 2>/dev/null || true
          wait "$LOGS_PID" 2>/dev/null || true
          echo "==== Log de execução da máquina $MACHINE_ID ===="
          cat /tmp/agent-cycle.log || echo "(sem log capturado)"
