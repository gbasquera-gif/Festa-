name: Festae - sandbox Mercado Pago (validade mínima do Pix)

# Duas travas antes de qualquer chamada ao Mercado Pago:
# 1. Enviar este branch NÃO executa o teste: o job só roda num commit cuja
#    mensagem contenha [executar-sandbox], criado de propósito depois da
#    autorização. Sem o marcador, o job aparece como "skipped".
# 2. O job usa o Environment protegido "mercadopago-sandbox": fica parado até
#    a aprovação manual do revisor, e só ele enxerga MP_SANDBOX_ACCESS_TOKEN.
# Nenhum outro segredo, nenhum banco, nenhum deploy.
on:
  push:
    branches: ["teste/sandbox-validade-pix"]

permissions:
  contents: read

concurrency:
  group: festae-sandbox-validade-pix
  cancel-in-progress: false

jobs:
  testar:
    if: contains(github.event.head_commit.message, '[executar-sandbox]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mercadopago-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Compilar o backend (a classe real do gateway)
        run: pnpm exec turbo run build --filter=@festae/backend...
      - name: Conferência da lógica sem rede
        working-directory: apps/backend
        run: node scripts/sandbox-validade-pix/testar.cjs --simular
      - name: Teste no sandbox (só credencial de teste)
        working-directory: apps/backend
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_SANDBOX_ACCESS_TOKEN }}
        run: node scripts/sandbox-validade-pix/testar.cjs
